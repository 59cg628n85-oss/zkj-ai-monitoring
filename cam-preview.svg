<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d2129"/>
      <stop offset="1" stop-color="#272f3d"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d4960"/>
      <stop offset="1" stop-color="#1d2129"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(1,120,236,0.18)" stroke-width="0.5"/>
    </pattern>
  </defs>
  <!-- background -->
  <rect width="400" height="240" fill="url(#bg)"/>
  <rect width="400" height="240" fill="url(#grid)"/>
  <!-- horizon / pipeline -->
  <rect x="0" y="140" width="400" height="100" fill="url(#floor)"/>
  <!-- silos / tanks -->
  <rect x="40" y="80" width="50" height="100" fill="#4e5969"/>
  <ellipse cx="65" cy="80" rx="25" ry="6" fill="#86909c"/>
  <rect x="110" y="90" width="35" height="90" fill="#4e5969"/>
  <ellipse cx="127.5" cy="90" rx="17.5" ry="4" fill="#86909c"/>
  <rect x="220" y="70" width="70" height="110" fill="#4e5969"/>
  <ellipse cx="255" cy="70" rx="35" ry="7" fill="#86909c"/>
  <rect x="320" y="100" width="40" height="80" fill="#4e5969"/>
  <ellipse cx="340" cy="100" rx="20" ry="5" fill="#86909c"/>
  <!-- pipes -->
  <rect x="0" y="155" width="400" height="6" fill="#165DFF" opacity="0.6"/>
  <rect x="0" y="170" width="400" height="3" fill="#86909c" opacity="0.5"/>
  <!-- warning glow -->
  <circle cx="65" cy="120" r="20" fill="rgb(1,120,236)" opacity="0.15"/>
  <!-- worker silhouette -->
  <g transform="translate(180, 130)">
    <circle cx="0" cy="0" r="6" fill="#fadb14"/>
    <rect x="-5" y="6" width="10" height="16" rx="2" fill="#f53f3f"/>
  </g>
  <g transform="translate(280, 135)">
    <circle cx="0" cy="0" r="6" fill="#fadb14"/>
    <rect x="-5" y="6" width="10" height="16" rx="2" fill="#00b42a"/>
  </g>
  <!-- timestamp -->
  <rect x="10" y="10" width="100" height="14" fill="rgba(0,0,0,0.5)" rx="2"/>
  <text x="14" y="20" fill="#00b42a" font-family="monospace" font-size="9">2026-09-21 14:23:08</text>
  <!-- crosshair / AI box -->
  <rect x="155" y="105" width="50" height="50" fill="none" stroke="rgb(1,120,236)" stroke-width="1"/>
  <text x="158" y="118" fill="rgb(1,120,236)" font-family="monospace" font-size="9">AI: 安全帽 ✓</text>
  <!-- camera ID -->
  <rect x="300" y="10" width="90" height="10" fill="rgba(0,0,0,0.5)" rx="2"/>
  <text x="304" y="18" fill="#fff" font-family="monospace" font-size="8">CAM-001 · LIVE</text>
</svg>
